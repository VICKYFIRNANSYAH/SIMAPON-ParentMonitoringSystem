server {
    listen 80;
    server_name simapon.firnansyah.web.id;

    # Redirect ke HTTPS (aktifkan setelah SSL terpasang di aaPanel)
    # return 301 https://$host$request_uri;

    # Static files
    location /static/ {
        alias /www/wwwroot/django/apps/simapon/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (upload pengguna)
    location /media/ {
        alias /www/wwwroot/django/apps/simapon/static/media/;
        expires 7d;
    }

    # GitHub Webhook endpoint
    location /webhook {
        proxy_pass http://127.0.0.1:9020/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 30;
    }

    # Django app (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}
