{% extends 'dashboards/admin/base.html' %} {% block admin_content %}
<div class="mb-8">
  <h2
    class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate"
  >
    Edit Catatan Perilaku
  </h2>
  <p class="mt-1 text-sm text-gray-500">Perbarui catatan sikap santri.</p>
</div>

<div class="max-w-2xl">
  <div class="bg-white shadow sm:rounded-lg">
    <div class="px-4 py-5 sm:p-6">
      <form method="POST" class="space-y-6">
        {% csrf_token %} {% for field in form %}
        <div>
          <label
            for="{{ field.id_for_label }}"
            class="block text-sm font-medium text-gray-700"
          >
            {{ field.label }}
          </label>
          {{ field }} {% if field.errors %}
          <p class="mt-1 text-sm text-red-600">{{ field.errors.0 }}</p>
          {% endif %}
        </div>
        {% endfor %}

        <div class="flex gap-3">
          <button
            type="submit"
            class="flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
          >
            Simpan Perubahan
          </button>
          <a
            href="{% url 'admin_behavior_list' %}"
            class="flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
          >
            Batal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
