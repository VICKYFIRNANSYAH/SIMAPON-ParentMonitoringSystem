{% extends 'dashboards/admin/base.html' %} {% block admin_content %}
<div class="mb-8">
  <h2
    class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate"
  >
    Edit Data Guru
  </h2>
  <p class="mt-1 text-sm text-gray-500">Perbarui informasi guru.</p>
</div>

<div class="max-w-2xl">
  <div class="bg-white shadow sm:rounded-lg">
    <div class="px-4 py-5 sm:p-6">
      <form method="POST" class="space-y-6">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Password baru (opsional)</label
          >
          <input
            type="password"
            name="password"
            id="password"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
            placeholder="Kosongkan jika tidak ingin mengubah password"
          />
        </div>
        {% csrf_token %}

        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">
            Username
          </label>
          <input
            type="text"
            name="username"
            id="username"
            value="{{ guru.username }}"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
            required
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email
          </label>
          <input
            type="email"
            name="email"
            id="email"
            value="{{ guru.email }}"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
            required
          />
        </div>

        <div>
          <label
            for="phone_number"
            class="block text-sm font-medium text-gray-700"
          >
            No. Telepon
          </label>
          <input
            type="tel"
            name="phone_number"
            id="phone_number"
            value="{{ guru.phone_number|default:'' }}"
            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
          />
        </div>

        <div class="flex gap-3">
          <button
            type="submit"
            class="flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
          >
            Simpan Perubahan
          </button>
          <a
            href="{% url 'admin_guru_list' %}"
            class="flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
          >
            Batal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
