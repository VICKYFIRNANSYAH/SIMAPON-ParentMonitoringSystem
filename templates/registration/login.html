{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Floating background glow effects -->
    <div class="absolute w-[20rem] h-[20rem] rounded-full bg-emerald-500/10 blur-[80px] -top-20 -left-20 pointer-events-none"></div>
    <div class="absolute w-[20rem] h-[20rem] rounded-full bg-cyan-500/10 blur-[80px] -bottom-20 -right-20 pointer-events-none"></div>

    <div class="max-w-md w-full glass-panel p-10 border border-white/40 shadow-soft transform transition-all duration-500 hover:scale-[1.005] animate-fade-up">
        <div class="flex flex-col items-center">
            <div class="relative mb-4">
                <div class="absolute -inset-2 bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-full opacity-20 blur-lg animate-pulse"></div>
                <img
                    src="{% static 'logo-simapon.png' %}"
                    alt="SIMAPON Logo"
                    class="h-16 w-16 rounded-full bg-slate-900/10 p-1 relative z-10 animate-bounce"
                    style="animation-duration: 4s;"
                />
            </div>
            <h2 class="text-3xl font-black font-display tracking-tight bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">
                Selamat Datang
            </h2>
            <p class="mt-2 text-center text-sm text-slate-500 font-medium">
                Silakan masuk ke akun SIMAPON Anda
            </p>
        </div>
        
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="rounded-xl border border-red-200 bg-red-50/70 backdrop-blur-md p-4 mb-4 animate-shake">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-bold text-red-800">Login Gagal</h3>
                        <p class="mt-1 text-xs text-red-700 font-semibold">Username atau password salah. Silakan coba lagi.</p>
                    </div>
                </div>
            </div>
            {% endif %}

            <div class="space-y-4">
                <div class="relative group">
                    <label for="username" class="sr-only">Username</label>
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input 
                        id="username" 
                        name="username" 
                        type="text" 
                        required 
                        class="pl-10 !bg-white/80 focus:!bg-white border-slate-200 focus:border-primary rounded-xl animate-item-1" 
                        placeholder="Username"
                    />
                </div>
                <div class="relative group">
                    <label for="password" class="sr-only">Password</label>
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input 
                        id="password" 
                        name="password" 
                        type="password" 
                        required 
                        class="pl-10 pr-10 !bg-white/80 focus:!bg-white border-slate-200 focus:border-primary rounded-xl animate-item-2" 
                        placeholder="Password"
                    />
                    <button
                        type="button"
                        onclick="togglePasswordInput('password', 'login_eye_icon')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                        title="Tampilkan/Sembunyikan Password"
                    >
                        <svg
                            id="login_eye_icon"
                            class="w-5 h-5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            ></path>
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                            ></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <button type="submit" class="btn btn-primary w-full py-3 text-sm font-extrabold rounded-xl transition-all shadow-md hover:scale-[1.01] hover:shadow-lg animate-item-3">
                    Masuk
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6 border-t border-slate-200/50 pt-5 animate-item-4">
            <p class="text-sm text-slate-500 font-medium">
                Belum punya akun Wali Murid? 
                <a href="{% url 'register' %}" class="font-bold text-primary hover:text-emerald-700 transition-colors">
                    Daftar Sekarang
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
